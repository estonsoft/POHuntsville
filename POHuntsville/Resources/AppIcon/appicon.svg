<svg width="100%" viewBox="0 0 500 500" role="img" xmlns="http://www.w3.org/2000/svg" style="">
  <title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Huntsville Wholesale Grocers L.L.C. logo</title>
  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Circular badge logo with dark navy blue background, gold Captain America style star in center, and white text.</desc>

  <defs>
    <path id="topArc" d="M 75,250 A 175,175 0 1,1 425,250"/>
    <path id="bottomArc" d="M 108,330 A 155,155 0 0,0 392,330"/>
  </defs>

  <!-- Outermost gold ring -->
  <circle cx="250" cy="250" r="240" fill="#C9A84C" style="fill:rgb(201, 168, 76);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Thin black separator -->
  <circle cx="250" cy="250" r="228" fill="#0a0a0a" style="fill:rgb(10, 10, 10);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Navy blue main circle -->
  <circle cx="250" cy="250" r="220" fill="#1A2A6C" style="fill:rgb(26, 42, 108);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Inner gold decorative ring -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#C9A84C" stroke-width="4" style="fill:none;stroke:rgb(201, 168, 76);color:rgb(0, 0, 0);stroke-width:4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#C9A84C" stroke-width="1.5" style="fill:none;stroke:rgb(201, 168, 76);color:rgb(0, 0, 0);stroke-width:1.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Dashed inner ring -->
  <circle cx="250" cy="250" r="195" fill="none" stroke="#C9A84C" stroke-width="0.5" stroke-dasharray="2 8" style="fill:none;stroke:rgb(201, 168, 76);color:rgb(0, 0, 0);stroke-width:0.5px;stroke-dasharray:2px, 8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Captain America style star centered at 250,250 -->
  <!-- Outer radius: 105, Inner radius: 42, 5 points, top point at -90deg -->
  <!-- Points calculated: outer tip every 72deg, inner at 36deg offsets -->
  <!-- Outer tips (r=105): -->
  <!-- 0: 250+105*cos(-90)=250, 250+105*sin(-90)=145 -->
  <!-- 1: 250+105*cos(-90+72)=250+105*cos(-18)=250+99.85=349.85, 250+105*sin(-18)=250-32.47=217.53 -->
  <!-- 2: 250+105*cos(-90+144)=250+105*cos(54)=250+61.67=311.67, 250+105*sin(54)=250+84.99=334.99 -->
  <!-- 3: 250+105*cos(-90+216)=250+105*cos(126)=250-61.67=188.33, 250+105*sin(126)=334.99 -->
  <!-- 4: 250+105*cos(-90+288)=250+105*cos(198)=250-99.85=150.15, 250+105*sin(198)=250-32.47=217.53 -->
  <!-- Inner notches (r=42): -->
  <!-- 0: 250+42*cos(-54)=250+24.69=274.69, 250+42*sin(-54)=250-33.99=216.01 -->
  <!-- 1: 250+42*cos(18)=250+39.94=289.94, 250+42*sin(18)=250+12.98=262.98 -->
  <!-- 2: 250+42*cos(90)=250, 250+42*sin(90)=292 -->
  <!-- 3: 250+42*cos(162)=250-39.94=210.06, 250+42*sin(162)=262.98 -->
  <!-- 4: 250+42*cos(234)=250-24.69=225.31, 250+42*sin(234)=216.01 -->
  <polygon points="&#10;      250,145&#10;      274.69,216.01&#10;      349.85,217.53&#10;      289.94,262.98&#10;      311.67,334.99&#10;      250,292&#10;      188.33,334.99&#10;      210.06,262.98&#10;      150.15,217.53&#10;      225.31,216.01&#10;    " fill="#C9A84C" stroke="#8a6010" stroke-width="2" stroke-linejoin="round" style="fill:rgb(201, 168, 76);stroke:rgb(138, 96, 16);color:rgb(0, 0, 0);stroke-width:2px;stroke-linecap:butt;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Curved text: HUNTSVILLE WHOLESALE top arc -->
  <text font-family="Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" letter-spacing="5" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:28px;font-weight:700;text-anchor:start;dominant-baseline:auto">
    <textPath href="#topArc" startOffset="9%" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:28px;font-weight:700;text-anchor:start;dominant-baseline:auto">HUNTSVILLE WHOLESALE</textPath>
  </text>

  <!-- Curved text: GROCERS L.L.C. bottom arc -->
  <text font-family="Georgia, serif" font-size="24" font-weight="bold" fill="#ffffff" letter-spacing="6" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:24px;font-weight:700;text-anchor:start;dominant-baseline:auto">
    <textPath href="#bottomArc" startOffset="15%" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:24px;font-weight:700;text-anchor:start;dominant-baseline:auto">GROCERS L.L.C</textPath>
  </text>

  <!-- Decorative dots -->
  <circle cx="125" cy="345" r="4" fill="#ffffff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="375" cy="345" r="4" fill="#ffffff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="82" cy="255" r="3" fill="#ffffff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <circle cx="418" cy="255" r="3" fill="#ffffff" style="fill:rgb(255, 255, 255);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
</svg>